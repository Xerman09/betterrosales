<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 420" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round" opacity="0.16">
    <!-- Subtle horizon & Agno valley curves -->
    <path d="M0,388 Q360,362 720,384 T1440,376" stroke-width="2" opacity="0.5"/>
    <path d="M0,404 Q420,382 840,398 T1440,392" stroke-width="1.5" opacity="0.35"/>

    <!-- Left: Presidencia / Municipal Hall Civic Arcade Silhouette -->
    <g transform="translate(80, 178)" opacity="0.55">
      <rect x="0" y="90" width="320" height="120" stroke-width="2.5"/>
      <polygon points="-12,90 160,36 332,90" stroke-width="2.5"/>
      <rect x="122" y="18" width="76" height="24" stroke-width="2"/>
      <path d="M148,18 L160,4 L172,18" stroke-width="2"/>
      <!-- Arched colonnade -->
      <path d="M28,210 V142 A18,18 0 0,1 64,142 V210" stroke-width="2"/>
      <path d="M84,210 V142 A18,18 0 0,1 120,142 V210" stroke-width="2"/>
      <path d="M140,210 V134 A20,20 0 0,1 180,134 V210" stroke-width="2.5"/>
      <path d="M200,210 V142 A18,18 0 0,1 236,142 V210" stroke-width="2"/>
      <path d="M256,210 V142 A18,18 0 0,1 292,142 V210" stroke-width="2"/>
    </g>

    <!-- Right-Center: Iconic Rosales Gateway Arch (behind Hero & Search Card) -->
    <g transform="translate(470, 26)">
      <!-- Left Arch Pillar -->
      <rect x="26" y="102" width="58" height="292" stroke-width="3.5" fill="#ffffff" fill-opacity="0.04"/>
      <rect x="18" y="88" width="74" height="16" rx="3" stroke-width="3" fill="#ffffff" fill-opacity="0.06"/>
      <rect x="14" y="374" width="82" height="20" rx="3" stroke-width="3"/>
      <path d="M44,132 V354 M66,132 V354" stroke-width="2" opacity="0.6"/>

      <!-- Right Arch Pillar -->
      <rect x="756" y="102" width="58" height="292" stroke-width="3.5" fill="#ffffff" fill-opacity="0.04"/>
      <rect x="748" y="88" width="74" height="16" rx="3" stroke-width="3" fill="#ffffff" fill-opacity="0.06"/>
      <rect x="744" y="374" width="82" height="20" rx="3" stroke-width="3"/>
      <path d="M774,132 V354 M796,132 V354" stroke-width="2" opacity="0.6"/>

      <!-- Overhead Arch Beam -->
      <rect x="84" y="114" width="672" height="68" stroke-width="3.5" fill="#ffffff" fill-opacity="0.05"/>
      <line x1="84" y1="126" x2="756" y2="126" stroke-width="2"/>
      <line x1="84" y1="170" x2="756" y2="170" stroke-width="2"/>

      <!-- Etched Arch Typography -->
      <text
        x="420"
        y="157"
        text-anchor="middle"
        fill="#ffffff"
        fill-opacity="0.48"
        stroke="none"
        font-family="system-ui, -apple-system, sans-serif"
        font-size="28"
        font-weight="800"
        letter-spacing="10"
      >ROSALES · PANGASINAN</text>

      <!-- Crown Rising Sunburst at Center of Arch -->
      <g transform="translate(420, 114)">
        <path d="M-92,0 A92,92 0 0,1 92,0" stroke-width="3" fill="#ffffff" fill-opacity="0.06"/>
        <path d="M-64,0 A64,64 0 0,1 64,0" stroke-width="2.5"/>
        <!-- Radiating geometric rays -->
        <line x1="-88" y1="-24" x2="-114" y2="-32" stroke-width="3.5"/>
        <line x1="-74" y1="-52" x2="-96" y2="-68" stroke-width="3.5"/>
        <line x1="-50" y1="-74" x2="-64" y2="-96" stroke-width="3.5"/>
        <line x1="-22" y1="-88" x2="-28" y2="-114" stroke-width="3.5"/>
        <line x1="0" y1="-92" x2="0" y2="-120" stroke-width="4"/>
        <line x1="22" y1="-88" x2="28" y2="-114" stroke-width="3.5"/>
        <line x1="50" y1="-74" x2="64" y2="-96" stroke-width="3.5"/>
        <line x1="74" y1="-52" x2="96" y2="-68" stroke-width="3.5"/>
        <line x1="88" y1="-24" x2="114" y2="-32" stroke-width="3.5"/>
      </g>
    </g>
  </g>
</svg>
